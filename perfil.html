<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-care</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar sm:navbar-expand bg-1 fg-2 navbar-verde">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Self-Care</a>
    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarNavAltMarkup" aria-labelledby="navbarNavAltMarkupLabel">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarNavAltMarkupLabel">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body">
        <div class="nav nav-pills navbar-nav">
          <a class="nav-link " aria-current="page" href="index.html">Inicio</a>
          <a class="nav-link" href="habitos.html">Hábitos</a>
          <a class="nav-link" href="progresso.html">Progresso</a>
          <a class="nav-link" href="novo.html">Adicionar novo hábito</a>
          <a class="nav-link active" href="perfil.html">Perfil</a>
        </div>
      </div>
    </dialog>
  </div>
</nav>
<main class="container py-4">
    <div class="mb-3">
        <form action="" class="mb-4" id="formPerfil">
        <label for="sizesInputDefault" class="form-label">Nome</label>
        <input class="form-control" type="text" id="nome" placeholder="Seu nome" aria-label="Default input example" >
    </div>
    <div class="mb-3">
        <label for="sizesInputDefault" class="form-label">Meta</label>
        <input class="form-control" type="number" id="metaDiaria" min="1" max="20" placeholder="Sua meta" aria-label="Default input example" >
    </div>
    <div class="mb-3">
        <button class="btn-verde">Salvar</button>
    </div>
    </form>
    <div class="row g-3 mb-4">
  <div class="col-md-4">
    <div class="card-num">
      <span class="num" id="totalHabitos">5</span>
      <span>Total de hábitos</span>
    </div>
  </div>
</div>
<div class="row g-3 mb-4">
  <div class="col-md-4">
    <div class="card-num">
      <span class="num" id="diasRegistrados">5</span>
      <span>Dias registrados</span>
    </div>
  </div>
</div>
<div class="row g-3 mb-4">
  <div class="col-md-4">
    <div class="card-num">
      <span class="num" id="habitoTop">beber pinga</span>
      <span>Seu hábito mais constante</span>
    </div>
  </div>
</div>
</main>
  <script src="storage.js"></script>
  <script src="script.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

</html>
